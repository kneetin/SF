name: Create Snowflake Warehouse

on:
  workflow_dispatch:

jobs:
  create-warehouse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "3.16"

      - name: Create Snowflake config
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.snowflake

          cat > ~/.snowflake/config.toml << EOF
          default_connection_name = "github_actions"

          [connections.github_actions]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USER}"
          password = "${SNOWFLAKE_PASSWORD}"
          role = "ACCOUNTADMIN"
          warehouse = "COMPUTE_WH"
          EOF

          chmod 600 ~/.snowflake/config.toml

      - name: Test Connection
        run: |
          snow connection test --connection github_actions

      - name: Create Warehouse
        run: |
          snow sql \
            --connection github_actions \
            --query "
            CREATE WAREHOUSE IF NOT EXISTS TEST_WH
            WAREHOUSE_SIZE='XSMALL'
            AUTO_SUSPEND=60
            AUTO_RESUME=TRUE;
            "

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.snowflake/config.toml
