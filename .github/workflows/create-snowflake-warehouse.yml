name: Deploy Snowflake Warehouse

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-actions@v3
        with:
          cli-version: "latest"

      - name: Create Snowflake Connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
        run: |
          mkdir -p ~/.snowflake

          cat > ~/.snowflake/config.toml << EOF
          default_connection_name = "github"

          [connections.github]
          account = "${SNOWFLAKE_ACCOUNT}"
          user = "${SNOWFLAKE_USER}"
          password = "${SNOWFLAKE_PASSWORD}"
          EOF

          chmod 600 ~/.snowflake/config.toml

      - name: Validate Connection
        run: |
          snow sql \
            --connection github \
            --query "
            SELECT
              CURRENT_USER(),
              CURRENT_ROLE(),
              CURRENT_ACCOUNT();
            "

      - name: Deploy SQL File
        run: |
          snow sql \
            --connection github \
            --filename snowflake/create_warehouse.sql

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.snowflake/config.toml
